<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E8F91">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>SunMoon YCT 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaigbscreen.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans+SC:wght@300;400&display=swap">
<style>
:root{
  --bg:#FAF7F0; --surface:#FFFFFF; --ink:#2B2622; --ink-2:#6E655C; --line:#E8E0D0;
  --sun:#F2BE55; --sun-2:#D49E35; --sun-soft:#FBF0D6; --on-sun:#2B2622;
  --moon:#4E8F91; --moon-2:#3C7375; --moon-soft:#E1EEEE; --on-moon:#FFFFFF;
  --ok:#5E9E5A; --ok-2:#4A8047; --ok-soft:#E6F0E1;
  --bad:#D9582F; --bad-2:#B44522; --bad-soft:#FBE6DC;
  --lock:#E3DCCD; --lock-2:#CBC2B0; --logo-filter:none;
  --f-display:"Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-han:"LXGW WenKai Screen","Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1B18; --surface:#2A2622; --ink:#F3EEE6; --ink-2:#B9AFA2; --line:#3D372F;
    --sun:#F2BE55; --sun-2:#C09232; --sun-soft:#3A3120;
    --moon:#6FAEB0; --moon-2:#4E8F91; --moon-soft:#24393A;
    --ok:#7DBA77; --ok-2:#5E9E5A; --ok-soft:#22331F;
    --bad:#E8744C; --bad-2:#C0572F; --bad-soft:#3E2419;
    --lock:#3A342D; --lock-2:#2D2823; --logo-filter:invert(1);
  }
}
:root[data-theme="dark"]{
  --bg:#1E1B18; --surface:#2A2622; --ink:#F3EEE6; --ink-2:#B9AFA2; --line:#3D372F;
    --sun:#F2BE55; --sun-2:#C09232; --sun-soft:#3A3120;
    --moon:#6FAEB0; --moon-2:#4E8F91; --moon-soft:#24393A;
    --ok:#7DBA77; --ok-2:#5E9E5A; --ok-soft:#22331F;
    --bad:#E8744C; --bad-2:#C0572F; --bad-soft:#3E2419;
    --lock:#3A342D; --lock-2:#2D2823; --logo-filter:invert(1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
.han{font-family:var(--f-han);font-weight:300}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font:600 22px/1 var(--f-display);letter-spacing:-.01em}
.brand .lm{height:40px;width:auto}
.brand .lw{height:22px;width:auto;filter:var(--logo-filter)}
.brand .lvl{white-space:nowrap}
.brand{min-width:0;flex:0 1 auto}
@media (max-width:400px){.brand .lw{height:18px}.chip{padding:6px 8px}.stats{gap:4px}}
@media (max-width:420px){.brand .lm{display:none}}
.brand .lvl{font:600 12px/1 var(--f-body);letter-spacing:.06em;background:var(--moon);color:var(--on-moon);padding:5px 8px;border-radius:999px}
.stats{margin-left:auto;display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:4px;font:600 15px/1 var(--f-body);padding:6px 10px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px}

/* ---------- home ---------- */
main{padding-block:18px 110px}
.next{display:flex;align-items:center;gap:14px;background:var(--moon);color:var(--on-moon);border-radius:20px;padding:16px;margin-bottom:26px}
.next svg{width:64px;height:64px;flex:none}
.next .t1{font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.next .t2{font:500 20px/1.2 var(--f-display);margin-top:4px;text-wrap:balance}
.next .btn{margin-left:auto;flex:none}

.unit{margin-bottom:10px}
.banner{display:flex;align-items:center;gap:12px;border-radius:18px;padding:14px 16px;background:var(--c);color:var(--onc);border-bottom:5px solid var(--c2)}
.banner .no{font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.banner .zh{font:300 24px/1.25 var(--f-han);margin-top:3px}
.banner .vi{font-weight:500;opacity:.9;font-size:15px}
.banner .cnt{margin-left:auto;font:600 14px/1 var(--f-body);background:rgba(255,255,255,.32);padding:6px 10px;border-radius:999px;white-space:nowrap}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:22px}
.node{position:relative;transform:translateX(var(--x,0));display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.node .dot{width:72px;height:66px;border-radius:50%;display:grid;place-items:center;font:400 30px/1 var(--f-han);background:var(--c);color:var(--onc);border-bottom:7px solid var(--c2);transition:transform .08s}
.node:active .dot{transform:translateY(4px);border-bottom-width:3px}
.node .lbl{font:600 13px/1.1 var(--f-body);color:var(--ink-2)}
.node.lock .dot{background:var(--lock);color:var(--lock-2);border-bottom-color:var(--lock-2)}
.node.done .dot{box-shadow:inset 0 0 0 4px rgba(255,255,255,.55)}
.node.cur .dot{box-shadow:0 0 0 6px var(--bg),0 0 0 11px var(--c)}
.node.cur .tip{position:absolute;top:-40px;white-space:nowrap;background:var(--surface);border:2px solid var(--line);color:var(--c2);font:600 13px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:12px;animation:bob 1.4s ease-in-out infinite}
.node.cur .tip::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.teacher{display:flex;align-items:center;gap:10px;margin-top:20px;padding:14px 16px;border:2px dashed var(--line);border-radius:var(--r);color:var(--ink-2);font-weight:500}
.teacher input{width:22px;height:22px;accent-color:var(--moon)}
.teacher small{display:block;font-weight:500;font-style:italic}

/* ---------- word book ---------- */
.book h2{font:600 22px/1.2 var(--f-display);margin:22px 0 8px;text-wrap:balance}
.book h2 span{font-family:var(--f-han);font-weight:500;color:var(--ink-2);font-size:18px;margin-left:6px}
.list{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:2px solid var(--line);padding:10px 14px}
.row:last-child{border-bottom:0}
.row .h{font:300 26px/1.1 var(--f-han)}
.row .p{font-weight:600;color:var(--moon)}
.row .v{color:var(--ink-2);font-size:15px}
.row .spk{width:40px;height:40px}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex;gap:8px;padding-block:8px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:14px;border:2px solid transparent;background:none;font:600 15px/1 var(--f-body);color:var(--ink-2)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{border-color:var(--moon);background:var(--moon-soft);color:var(--moon)}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:16px;padding:14px 22px;font:600 16px/1.25 var(--f-body);letter-spacing:0;text-transform:none;background:var(--sun);color:var(--on-sun);border-bottom:5px solid var(--sun-2);transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{background:var(--lock);color:var(--lock-2);border-bottom-color:var(--lock-2);cursor:default}
.btn.wide{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:2px solid var(--line);border-bottom-width:5px}
.btn.okb{background:var(--ok);color:#fff;border-bottom-color:var(--ok-2)}
.btn.badb{background:var(--bad);color:#fff;border-bottom-color:var(--bad-2)}
.spk{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;border:0;background:var(--moon);color:var(--on-moon);border-bottom:4px solid var(--moon-2);flex:none}
.spk svg{width:60%;height:60%}
.spk.big{width:96px;height:96px;border-radius:24px;border-bottom-width:7px}
.spk.slow{background:var(--moon-soft);color:var(--moon);border-bottom-color:var(--line)}

/* ---------- lesson ---------- */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lhead{display:flex;align-items:center;gap:12px;padding-block:14px}
.x{width:40px;height:40px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center;flex:none}
.x svg{width:26px;height:26px}
.bar{flex:1;height:16px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--ok);transition:width .35s ease}
.hearts{display:flex;align-items:center;gap:4px;font:600 17px/1 var(--f-body);color:var(--bad);font-variant-numeric:tabular-nums}
.hearts svg{width:24px;height:24px}
.lbody{flex:1;overflow-y:auto}
.lbody .wrap{padding-block:8px 24px}
.ask{font:600 24px/1.2 var(--f-display);margin:6px 0 18px;text-wrap:balance}
.lfoot{border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.lfoot .wrap{display:flex;gap:10px;padding-block:14px}
.lfoot .btn{flex:1}

.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.card .p{font:600 20px/1 var(--f-body);color:var(--moon)}
.card .h{font:300 min(88px,22vw)/1.1 var(--f-han)}
.card .v{font:500 20px/1.3 var(--f-body);text-wrap:balance}
.card .row2{display:flex;gap:10px;margin-top:6px}
.pill{font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--on-sun);background:var(--sun);padding:6px 10px;border-radius:999px}
.parts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.parts span{font:500 15px/1.2 var(--f-body);color:var(--ink-2);background:var(--bg);border-radius:10px;padding:6px 10px}
.parts b{font:300 20px/1 var(--f-han);color:var(--ink);margin-right:4px}

.prompt{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.prompt .bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px;flex:1;min-width:0}
.prompt .bubble .h{font:300 40px/1.15 var(--f-han)}
.prompt .bubble .p{font-weight:600;color:var(--moon)}
.prompt .bubble .v{font:500 19px/1.35 var(--f-body)}
.prompt>svg{width:74px;height:74px;flex:none}
.listen{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:8px 0 26px}

.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 12px;text-align:center;font:500 18px/1.3 var(--f-body);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt .h{font:300 32px/1.1 var(--f-han)}
.opt .p{font-size:14px;color:var(--ink-2);font-weight:500}
.opt.sel{border-color:var(--moon);background:var(--moon-soft);color:var(--moon)}
.opt.good{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shake .3s}
.opt.gone{opacity:.28;pointer-events:none}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.ans{min-height:78px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:10px;margin-bottom:22px;background:repeating-linear-gradient(transparent 0 76px,var(--line) 76px 78px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:6px 12px 8px;display:flex;flex-direction:column;align-items:center;min-width:56px}
.tile .p{font:500 12px/1.2 var(--f-body);color:var(--ink-2)}
.tile .h{font:300 26px/1.15 var(--f-han)}
.tile.used{visibility:hidden}

.writebox{position:relative;width:min(300px,100%);aspect-ratio:1;margin:0 auto;background:var(--surface);border:3px solid var(--bad);border-radius:8px}
.writebox svg.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.writebox .hw{position:absolute;inset:0}
.writebox .hw svg{width:100%;height:100%}
.wtools{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.wtools .btn{padding:11px 16px;font-size:14px}
.winfo{text-align:center;margin-bottom:14px}
.winfo .p{font:600 20px/1 var(--f-body);color:var(--moon)}
.winfo .v{color:var(--ink-2);font-weight:500}

.sheet{position:absolute;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .18s ease-out}
.sheet .wrap{padding-block:16px}
.sheet.ok{background:var(--ok-soft);color:var(--ok)}
.sheet.bad{background:var(--bad-soft);color:var(--bad)}
.sheet .ttl{display:flex;align-items:center;gap:10px;font:600 22px/1.2 var(--f-display)}
.sheet .ttl svg{width:40px;height:40px}
.sheet .sol{margin:6px 0 14px;font-weight:500;color:var(--ink)}
.sheet .sol .h{font:300 22px/1.3 var(--f-han)}
@keyframes up{from{transform:translateY(100%)}}

/* ---------- finish ---------- */
.finish{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));overflow:auto}
.finish .wrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.finish svg.m{width:140px;height:140px}
.finish h1{font:600 32px/1.1 var(--f-display);margin:0;color:var(--sun-2);text-wrap:balance}
.finish p{margin:0;color:var(--ink-2);font-weight:500}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:10px 0 8px}
.tiles3 div{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:10px 6px}
.tiles3 b{display:block;font:600 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tiles3 span{font:600 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.finish .btn{width:100%}
.tiles3 b span{font:inherit;color:inherit;letter-spacing:0;text-transform:none}

/* word sheet */
.modal{position:fixed;inset:0;z-index:25;background:rgba(10,14,40,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .panel{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:92%;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.modal .panel .x{margin-left:auto}
.chars{display:flex;gap:8px;justify-content:center;margin:12px 0}
.chars button{font:300 26px/1 var(--f-han);width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.chars button[aria-pressed="true"]{border-color:var(--moon);background:var(--moon-soft);color:var(--moon)}

.acct{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--moon);flex:none;font:600 16px/1 var(--f-body);padding:0}
.acct svg{width:22px;height:22px}
.acct.on{background:var(--moon);color:var(--on-moon);border-color:var(--moon)}
.paylock{margin-left:auto;display:flex;align-items:center;gap:4px;font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.32);padding:6px 10px;border-radius:999px;white-space:nowrap}
.pw{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.pw svg.m{width:92px;height:92px}
.pw h2{font:600 24px/1.2 var(--f-display);margin:0;text-wrap:balance}
.pw ul{text-align:left;margin:0;padding-left:20px;color:var(--ink-2);align-self:stretch}
.pw li b{color:var(--ink)}
.choice{align-self:stretch;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left}
.choice h3{margin:0;font:600 18px/1.2 var(--f-display)}
.choice small{color:var(--ink-2);font-style:italic}
.price{font:600 30px/1 var(--f-display);color:var(--bad);font-variant-numeric:tabular-nums}
.price span{font:500 14px/1 var(--f-body);color:var(--ink-2);margin-left:6px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px;color:var(--ink-2);text-align:left;align-self:stretch}
.field input{font:500 17px/1.2 var(--f-body);padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.field input:focus{outline:none;border-color:var(--moon)}
.qr{background:#fff;border-radius:14px;padding:10px;width:230px;max-width:100%;align-self:center}
.qr svg{display:block;width:100%;height:auto}
.bankinfo{font-size:14px;color:var(--ink-2);line-height:1.6;text-align:center}
.bankinfo b{color:var(--ink)}
.err{color:var(--bad);font-weight:500;font-size:14px;min-height:1.2em;margin:0}
a.btn{display:block;text-align:center;text-decoration:none}
.strip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.strip figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.strip svg{width:46px;height:46px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.strip figcaption{font:600 11px/1 var(--f-body);color:var(--ink-2);font-variant-numeric:tabular-nums}
.striph{text-align:center;font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-top:16px}
.lead{text-align:center;margin:-6px 0 14px}
.lead .zh{font:300 44px/1.1 var(--f-han)}
.lead .p{font-weight:600;color:var(--moon)}
.lead .v{font:600 19px/1.3 var(--f-display)}
.lead .d{color:var(--ink-2);margin-top:4px;text-wrap:balance}
svg .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
svg .rays{transform-origin:50px 50px;animation:pulse 2.4s ease-in-out infinite}
.next>svg,.pw svg.m,.prompt>svg{animation:hop 2.6s ease-in-out infinite}
.finish svg.m{animation:hop 1s ease-in-out infinite}
.finish h1{animation:pop .5s ease-out both}
.tiles3 div{animation:pop .5s ease-out both}
.tiles3 div:nth-child(2){animation-delay:.12s}.tiles3 div:nth-child(3){animation-delay:.24s}
.bump{animation:pop .45s ease-out}
.sheet.ok .ttl svg{animation:pop .4s ease-out}
.sheet.bad .ttl{animation:shake .35s}
.lxp{display:flex;align-items:center;gap:4px;font:600 17px/1 var(--f-body);color:var(--sun-2);font-variant-numeric:tabular-nums}
.lxp svg{width:22px;height:22px}
.plus{position:fixed;z-index:55;pointer-events:none;font:600 22px/1 var(--f-display);color:var(--sun-2);text-shadow:0 1px 0 #fff;animation:floatup 1s ease-out forwards}
.spark{position:fixed;z-index:55;pointer-events:none;width:14px;height:14px;animation:spark .7s ease-out forwards}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-10px) rotate(-5deg)}50%{transform:translateY(0) rotate(0)}70%{transform:translateY(-4px) rotate(4deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-12px) scale(1.15)}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
@keyframes spark{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(160deg);opacity:0}}
.blank{display:inline-block;min-width:1.6em;padding:0 .2em;margin:0 .1em;border-bottom:3px solid var(--moon);color:var(--moon);text-align:center}
.radbig svg{width:150px;height:150px;display:block}
.radmid svg{width:110px;height:110px;display:block}
.radchip{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 4px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font:400 22px/1 var(--f-han);vertical-align:middle}
.radeq{font:300 30px/1.2 var(--f-han);color:var(--ink);display:flex;gap:10px;align-items:center;justify-content:center}
.radeq.big{font-size:52px;margin:10px 0 24px}
.node .nc{position:absolute;top:-10px;z-index:1;font:600 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:#7E5373;color:#fff;padding:4px 7px;border-radius:999px;white-space:nowrap}
.node.adv .dot{background:linear-gradient(145deg,#9C6B8E,#6E4766);color:#F2BE55;border-bottom-color:#5A3953}
.node.adv.lock .dot{background:linear-gradient(145deg,#C7AFC0,#A88BA0);color:#fff;border-bottom-color:#8E7086}
.node.adv.done .dot{box-shadow:inset 0 0 0 4px rgba(242,190,85,.7)}
.pkg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pkg button{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--bg);padding:10px 8px;text-align:left;font:500 13px/1.3 var(--f-body);color:var(--ink-2)}
.pkg button b{display:block;font:600 20px/1.1 var(--f-display);color:var(--bad);margin-top:2px}
.pkg button[aria-pressed="true"]{border-color:var(--moon);background:var(--moon-soft);color:var(--ink)}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{aspect-ratio:3/4;border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);display:grid;place-items:center;text-align:center;padding:4px;font:600 14px/1.2 var(--f-body);transition:transform .25s;perspective:600px}
.mcard .f{display:none}
.mcard .b{font:600 26px/1 var(--f-display);color:var(--moon)}
.mcard.up .f{display:block}.mcard.up .b{display:none}
.mcard.up{background:var(--moon-soft);border-color:var(--moon);animation:flip .25s ease-out}
.mcard.ok{background:var(--ok-soft);border-color:var(--ok);animation:pop .35s}
.mcard .h{font:300 28px/1.1 var(--f-han)}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.timer{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 0 14px}
.timer i{display:block;height:100%;background:var(--sun);transition:width 1s linear}
.score{display:flex;justify-content:space-between;font:600 15px/1 var(--f-body);color:var(--ink-2);margin-bottom:10px}
.bdg{font:600 15px/1 var(--f-body)}
.mic{width:110px;height:110px;border-radius:50%;border:0;background:var(--bad);color:#fff;display:grid;place-items:center;margin:0 auto;border-bottom:6px solid var(--bad-2)}
.mic svg{width:46px;height:46px}
.mic[data-on="1"]{animation:mic 1s ease-in-out infinite}
.mic:disabled{background:var(--lock);color:var(--lock-2);border-bottom-color:var(--lock-2)}
@keyframes mic{50%{transform:scale(1.08);box-shadow:0 0 0 14px var(--bad-soft)}}
.heard{text-align:center;margin-top:14px;font-weight:500;color:var(--ink-2);min-height:1.4em}
.heard b{font-family:var(--f-han);font-weight:400;color:var(--ink);font-size:20px}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.node.song .dot{background:var(--surface);color:var(--c2);border:2px solid var(--c);border-bottom:6px solid var(--c2);font-size:30px}
.mascot{display:block;height:auto;flex:none;object-fit:contain}
.next>.mascot{width:64px}
.prompt>.mascot{width:74px}
.pw .mascot.m{width:96px}
.finish .mascot.m{width:150px}
.next>.mascot,.pw .mascot.m,.prompt>.mascot{animation:hop 2.6s ease-in-out infinite}
.finish .mascot.m{animation:hop 1s ease-in-out infinite}
.dlbox{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.dline{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;max-width:92%}
.dline.b{align-self:flex-end;background:var(--moon-soft);border-color:transparent}
.dline>b{font:600 13px/1.6 var(--f-body);color:var(--moon)}
.dline .h{font-size:20px}
.dline small{color:var(--ink-2)}
.dline.on{border-color:var(--sun)}
.dline.ctx{margin-bottom:12px;align-items:center}
.dline.ctx .spk{width:40px;height:40px;margin-left:auto}
.qbox{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.qbox .h{font-size:22px}.qbox .v{color:var(--ink-2);font-weight:500}
.passage{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.passage .h{font-size:22px;line-height:1.7}
.passage .pp{color:var(--moon);font-weight:500;margin-top:6px}.passage .pv{color:var(--ink-2);margin-top:6px;font-style:italic}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);font-weight:500;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const NODES = [];

  L.nodes = [];
  if (L.review) {
    L.nodes.push({ id: `${i}-r0`, type: "r", lesson: i, label: "Ôn từ vựng 1", icon: "复" },
                 { id: `${i}-r1`, type: "r", lesson: i, label: "Ôn từ vựng 2", icon: "习" },
                 { id: `${i}-s`, type: "s", lesson: i, label: "Ôn câu", icon: "句" },
                 { id: `${i}-v0`, type: "v", lesson: i, label: "Ôn viết chữ", icon: "写", review: true });
    NODES.push(...L.nodes); return;
  }
  const bh = (SONGS["YCT1"] || {})[i];
  if (bh) L.nodes.push({ id: `${i}-y`, type: "y", lesson: i, label: "Bài hát", icon: "♪", song: bh, free: true });
  const n = L.W.length, parts = Math.ceil(n / 5), size = Math.ceil(n / parts);
  for (let k = 0; k < parts; k++) {
    const words = L.W.slice(k * size, (k + 1) * size);
    L.nodes.push({ id: `${i}-w${k}`, type: "w", lesson: i, words, label: parts > 1 ? `Từ mới ${k + 1}` : "Từ mới", icon: words[0].h[0] });
  }
  const wc = [...new Set(L.W.flatMap(w => [...w.h]))].filter(c => STROKES[c]);
  const vp = Math.ceil(wc.length / 5), vs = Math.ceil(wc.length / vp);
  for (let k = 0; k < vp; k++)
    L.nodes.push({ id: `${i}-v${k}`, type: "v", lesson: i, chars: wc.slice(k * vs, (k + 1) * vs), label: vp > 1 ? `Tập viết ${k + 1}` : "Tập viết", icon: "写" });
  const rc = [...new Set(L.W.flatMap(w => [...w.h]))].filter(radOk).slice(0, 4);
  // 4 kỹ năng: Nghe → Nói → Đọc → Viết (viết chữ ở trên, viết câu ở dưới)
  const vChu = L.nodes.filter(n => n.type === "v"); L.nodes = L.nodes.filter(n => n.type !== "v");
  L.nodes.push({ id: `${i}-nghe`, type: "nghe", lesson: i, label: "Nghe", icon: "听" });
  L.nodes.push({ id: `${i}-noi`, type: "noiCB", lesson: i, label: "Nói", icon: "说" });
  L.nodes.push({ id: `${i}-doc`, type: "doc", lesson: i, label: "Đọc", icon: "读" });
  vChu.forEach((n, k) => { n.label = vChu.length > 1 ? `Viết chữ ${k + 1}` : "Viết chữ"; L.nodes.push(n); });
  L.nodes.push({ id: `${i}-viet`, type: "viet", lesson: i, label: "Viết câu", icon: "写" });
  // ---- NÂNG CAO (trả phí): mở khi xong phần cơ bản của bài

function tlv(id, v) { return id + String(v.length).padStart(2, "0") + v; }
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, "0"); }
function vietQR(amount, msg) {
  const acc = tlv("00", "A000000727") + tlv("01", tlv("00", "970432") + tlv("01", "272727888888")) + tlv("02", "QRIBFTTA");
  const s = tlv("00", "01") + tlv("01", "12") + tlv("38", acc) + tlv("53", "704") + tlv("54", String(amount)) + tlv("58", "VN") + tlv("62", tlv("08", msg)) + "6304";
  return s + crc16(s);
}
function qrDraw(el, amount, msg) {
  if (!el) return;
  if (!window.qrcode) { el.hidden = true; return; }

}

let AC = null;
const SOUND_KEY = "sunmoon-sound";
let SOUND_ON = true; try { SOUND_ON = localStorage.getItem(SOUND_KEY) !== "0"; } catch (e) {}
function ac() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
document.addEventListener("pointerdown", () => { try { ac(); } catch (e) {} }, { once: true });
function tone(f, t0, dur, type = "sine", vol = .18) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function sfx(k) {
  if (!SOUND_ON) return;
  try {
    if (k === "tap") tone(660, 0, .07, "triangle", .1);
    else if (k === "ok") { tone(784, 0, .14, "sine", .22); tone(1175, .1, .25, "sine", .22); }
    else if (k === "pop") { tone(880, 0, .08, "triangle", .16); tone(1320, .05, .12, "triangle", .14); }
    else if (k === "bad") { tone(233, 0, .16, "square", .06); tone(196, .13, .24, "square", .06); }
    else if (k === "win") [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .09, .3, "triangle", .16));
  } catch (e) {}
}

let zhVoice = null;
function loadVoices() { if (!("speechSynthesis" in window)) return; const v = speechSynthesis.getVoices(); zhVoice = v.find(x => /^zh[-_]CN/i.test(x.lang)) || v.find(x => /^zh/i.test(x.lang)) || null; }

const player = new Audio();
function speak(t, slow) {
  if (AUDIO[t]) {
    try { player.pause(); player.src = AUDIO[t]; player.preservesPitch = true; player.playbackRate = slow ? .65 : 1; player.play().catch(() => {}); } catch (e) {}
    return;
  }
  if (!("speechSynthesis" in window)) return toast("Máy này chưa có giọng đọc tiếng Trung");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = "zh-CN"; if (zhVoice) u.voice = zhVoice; u.rate = slow ? .55 : .85;
  speechSynthesis.speak(u);
}

/* ================== exercises ================== */
function distract(w, key, n = 3, ok = () => true) {
  const out = [], seen = new Set([w[key]]);
  const pools = [shuffle(LESSONS[w.l].W), shuffle(ALL.filter(x => x.l < w.l)), shuffle(ALL)];
  for (const pool of pools) for (const x of pool) {
    if (out.length === n) return out;
    if (!seen.has(x[key]) && ok(x)) { seen.add(x[key]); out.push(x); }
  }
  return out;
}
const canListen = w => !PARTICLES.has(w.h);
function exWords(node) {
  const W = node.words, q = [];
  for (let i = 0; i < W.length; i += 2) {
    const g = W.slice(i, i + 2);
    g.forEach(w => q.push({ t: "intro", w }));
    g.forEach((w, j) => q.push(j === 0 ? { t: "meaning", w } : canListen(w) ? { t: "listen", w } : { t: "pinyin", w }));
  }
  if (W.length >= 3) q.push({ t: "match", ws: W.slice(0, 5) });
  if (W.length >= 3) q.push({ t: "match", ws: shuffle(W).slice(0, 5), py: true });
  const r = shuffle(W);
  q.push({ t: "reverse", w: r[0] });
  if (r[1]) q.push({ t: "pinyin", w: r[1] });
  const lw = shuffle(W.filter(canListen))[0]; if (lw) q.push({ t: "listen", w: lw });
  return q;
}
// từ cùng nhóm thay vào vẫn thành câu đúng → không dùng làm đáp án nhiễu
const FILL_GROUPS = [["我","你","他","她","您","我们","你们","他们","她们","它"],["一","二","两","三","四","五","六","七","八","九","十","几","多少"],
  ["这","那","哪"],["这儿","那儿","哪儿","这里","那里"],["今天","明天","昨天","现在"],["爸爸","妈妈","哥哥","姐姐","弟弟","妹妹","爷爷","奶奶"],["很","太","真","非常","更","最"]];
function blankOf(s) {
  const cand = s.t.map((x, i) => i).filter(i => !PARTICLES.has(s.t[i]));
  const pref = cand.filter(i => ALL.some(w => w.h === s.t[i] && w.l === s.l));
  const pool = pref.length ? pref : cand;
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : 0;
}
function exSents(L) {
  const q = [];
  L.sents.forEach((s, k) => q.push({ t: k === 1 ? "listenArr" : "arrange", s }));
  q.splice(1, 0, { t: "match", ws: shuffle(L.W).slice(0, 5) });
  shuffle(L.sents).slice(0, 2).forEach(s => q.push({ t: "fill", s, k: blankOf(s) }));
  q.push({ t: "read", s: shuffle(L.sents)[0] });
  return q;
}
// Thử thách: không pinyin, thêm từ gây nhiễu, nghe chọn câu, viết theo trí nhớ
function exHard(L) {
  const ss = shuffle(L.sents), q = [];
  ss.slice(0, 2).forEach(s => q.push({ t: "arrange", s, hard: true }));
  ss.slice(0, 3).forEach(s => q.push({ t: "fill", s, k: blankOf(s), hard: true }));
  ss.slice(1, 3).forEach(s => q.push({ t: "hearsent", s }));
  shuffle(L.W).slice(0, 2).forEach(w => q.push({ t: "reverse", w, hard: true }));
  const wr = shuffle([...new Set(L.W.flatMap(w => [...w.h]))].filter(c => STROKES[c])).slice(0, 2).map(c => ({ t: "write", c, memory: true }));
  return shuffle(q).concat(wr);
}
// Luyện nói: 3 từ + 2 câu
function exNoi(L) {
  return [...shuffle(L.W).slice(0, 3).map(w => ({ t: "noi", zh: w.h, p: w.p, v: w.v })),
    ...shuffle(L.sents).slice(0, 2).map(s => ({ t: "noi", zh: sentZh(s), p: s.p, v: s.v }))];
}
// Kiểm tra cuối bài: 10 câu trộn, không gợi ý, sai không làm lại
function exTest(L) {
  const W = shuffle(L.W), ss = shuffle(L.sents), q = [];
  W.slice(0, 3).forEach(w => q.push({ t: "meaning", w }));
  W.slice(3, 5).filter(canListen).forEach(w => q.push({ t: "listen", w }));
  W.slice(5, 6).forEach(w => q.push({ t: "reverse", w, hard: true }));
  ss.slice(0, 2).forEach(s => q.push({ t: "fill", s, k: blankOf(s), hard: true }));
  ss.slice(0, 2).forEach(s => q.push({ t: "arrange", s, hard: true }));
  if (ss[1]) q.push({ t: "hearsent", s: ss[1] });
  return shuffle(q).slice(0, 10);
}
// NGHE: nghe chọn từ, nghe xếp câu, nghe hội thoại trả lời câu hỏi, nghe chọn câu
function exNghe(L) {
  const q = [], nd = ND[L.i] || {};
  shuffle(L.W.filter(canListen)).slice(0, 3).forEach(w => q.push({ t: "listen", w }));
  const ss = shuffle(L.sents);
  if (ss[0]) q.push({ t: "listenArr", s: ss[0] });
  if (ss[1]) q.push({ t: "hearsent", s: ss[1] });
  if (nd.dl) nd.dl.qs.forEach((x, k) => q.push({ t: "dlq", dl: nd.dl, qi: k }));
  return q;
}
// NÓI: đọc theo từ, đọc theo câu, đóng vai trong hội thoại
function exNoiCB(L) {
  const q = [], nd = ND[L.i] || {};
  shuffle(L.W).slice(0, 2).forEach(w => q.push({ t: "noi", zh: w.h, p: w.p, v: w.v }));
  shuffle(L.sents).slice(0, 1).forEach(s => q.push({ t: "noi", zh: sentZh(s), p: s.p, v: s.v }));
  if (nd.dl) nd.dl.lines.forEach((l, k) => { if (k > 0 && l.r === "B" && q.length < 6) q.push({ t: "noi", zh: l.z, p: l.p, v: l.v, ctx: nd.dl.lines[k - 1] }); });

}
// ĐỌC: đọc hiểu câu, điền từ, nối pinyin, đọc đoạn văn trả lời câu hỏi
function exDoc(L) {
  const q = [], nd = ND[L.i] || {}, ss = shuffle(L.sents);
  if (ss[0]) q.push({ t: "read", s: ss[0] });
  ss.slice(1, 3).forEach(s => q.push({ t: "fill", s, k: blankOf(s) }));
  if (L.W.length >= 3) q.push({ t: "match", ws: shuffle(L.W).slice(0, 5), py: true });
  if (nd.rd) nd.rd.qs.forEach((x, k) => q.push({ t: "rdq", rd: nd.rd, qi: k }));

}
// VIẾT CÂU: ghép chữ thành từ, ghép câu (dịch sang tiếng Trung), nghe viết chữ
function exViet(L) {
  const q = [];
  shuffle(L.W.filter(w => w.h.length > 1 && [...w.h].every(c => /[\u4e00-\u9fff]/.test(c)))).slice(0, 3).forEach(w => q.push({ t: "wordbuild", w }));
  shuffle(L.sents).slice(0, 2).forEach(s => q.push({ t: "arrange", s }));
  shuffle(L.W.filter(w => w.h.length === 1 && STROKES[w.h] && canListen(w))).slice(0, 2).forEach(w => q.push({ t: "write", c: w.h, memory: true, dict: true }));

}
function exRad(node) {
  const cards = node.chars.map(c => ({ t: "radcard", c }));
  const quiz = node.chars.map(c => ({ t: "radpick", c })).concat(node.chars.filter(c => RAD[c][1]).map(c => ({ t: "radjoin", c })));
  return cards.concat(shuffle(quiz));
}

function exReview() {
  const ws = shuffle(ALL).slice(0, 8), types = ["meaning", "listen", "reverse", "pinyin"], q = [];
  ws.forEach((w, i) => { let t = types[i % 4]; if (t === "listen" && !canListen(w)) t = "meaning"; q.push({ t, w }); });

}

    const c = ex.c, p = RAD[c][1];
    const pool = Object.keys(RAD).filter(x => x !== c && STROKES[x]);
    const near = pool.filter(x => RAD[x][1] && (RAD[x][1].includes(p[0]) || RAD[x][1].includes(p[1])));
    const opts = shuffle([c, ...shuffle(near).slice(0, 2), ...shuffle(pool.filter(x => !near.includes(x))).slice(0, 3)].slice(0, 4));
    stage.innerHTML = `<div class="ask">Ghép hai phần thành chữ</div><div class="radeq big"><span class="han">${esc(radChar(p[0]))}</span>+<span class="han">${esc(radChar(p[1]))}</span>=<span class="blank">？</span></div>` +
      optionsHtml(opts.map(o => ({ k: o, html: `<span class="h">${esc(o)}</span>` })), true);
    bindOptions(k => speak(k)); S.checker = () => S.ans === c; S.key = c;
    const w = ALL.find(x => x.h === c) || ALL.find(x => x.h.includes(c));
    S.sol = `<span class="h">${esc(radChar(p[0]))} + ${esc(radChar(p[1]))} = ${esc(c)}</span>${w ? " · " + esc(w.h === c ? w.v : w.h + " · " + w.v) : ""}`;
  },

  read(ex) {
    const s = ex.s;
    const others = shuffle(LESSONS.slice(Math.max(0, s.l - 2), s.l + 1).flatMap(L => L.sents).filter(x => x !== s && x.v !== s.v)).slice(0, 2);
    const opts = shuffle([s, ...others]);
    stage.innerHTML = `<div class="ask">Câu này nghĩa là gì?</div><div class="prompt">${mascot("wow")}<div class="bubble"><div class="p">${esc(s.p)}</div><div class="h" style="font-size:30px">${esc(sentZh(s))}</div></div><button class="spk" data-say aria-label="Nghe">${IC.spk}</button></div>` + optionsHtml(opts.map(o => ({ k: o.v, html: esc(o.v) })));
    stage.querySelector("[data-say]").onclick = () => speak(sentZh(s));
    bindOptions(); S.checker = () => S.ans === s.v; S.key = s.v; S.sol = sentSol(s);
  },
  stroke(ex) {
    const b = ex.b, i = STROKE_BASICS.indexOf(b), w = ALL.find(x => x.h === b.c);
    S.mode = "intro"; checkBtn.disabled = false; checkBtn.textContent = "Tiếp tục";
    stage.innerHTML = `<div class="ask">Nét cơ bản ${i + 1}/${STROKE_BASICS.length}</div><div class="lead"><div class="zh">${b.zh}</div><div class="p">${b.p}</div><div class="v">${b.v}</div><div class="d">${b.d}</div></div>` + writeBoxHtml() +
      `<p class="lead d" style="margin-top:12px">Trong chữ <span class="han" style="font-size:22px">${b.c}</span>${w ? ` (${esc(w.p)} · ${esc(w.v)})` : ""}, đây là nét thứ ${b.k + 1}</p>`;
    const my = S.i;
    requestAnimationFrame(() => {
      const wr = makeWriter(b.c, false); if (!wr) return; S.writer = wr;
      const loop = () => { if (!S || S.i !== my) return; wr.hideCharacter({ duration: 0 }); wr.animateStroke(b.k, { onComplete: () => setTimeout(loop, 900) }); };
      loop();
    });
  },
  rule(ex) {
    const r = ex.r, i = STROKE_RULES.indexOf(r), w = ALL.find(x => x.h === r.c);
    S.mode = "intro"; checkBtn.disabled = false; checkBtn.textContent = "Tiếp tục";
    stage.innerHTML = `<div class="ask">Quy tắc ${i + 1}/${STROKE_RULES.length}</div><div class="lead"><div class="zh">${r.zh}</div><div class="p">${r.p}</div><div class="v">${r.v}</div><div class="d">Ví dụ: chữ <span class="han">${r.c}</span>${w ? ` (${esc(w.p)} · ${esc(w.v)})` : ""}</div></div>` + writeBoxHtml() + strokeStrip(r.c);
    requestAnimationFrame(() => { const wr = makeWriter(r.c, false); if (wr) { S.writer = wr; wr.loopCharacterAnimation(); } });
  },
  write(ex) {
    const c = ex.c, w = ALL.find(x => x.h === c) || ALL.find(x => x.h.includes(c));
    const py = w && w.h === c ? w.p : (w ? w.p.split(" ")[0] : "");
    const mem = !!ex.memory, own = w && w.h === c;
    const py1 = own ? w.p : (PY[c] || "");
    S.mode = "write"; checkBtn.hidden = true; skipBtn.hidden = false;
    if (ex.dict) {
      S.mode = "write"; checkBtn.hidden = true; skipBtn.hidden = false;
      stage.innerHTML = `<div class="ask">Nghe rồi viết chữ</div><div class="listen" style="margin:0 0 14px"><button class="spk big" id="wSay" aria-label="Nghe">${IC.spk}</button></div>` + writeBoxHtml() +
        `<div class="wtools"><button class="btn ghost" id="wHint">Chưa nhớ · Xem gợi ý</button></div>`;
      const o2 = { onComplete: ({ totalMistakes }) => { S.mode = "check"; feedback(true, `<span class="h">${esc(c)}</span> · ${esc(py1)} · ${w ? esc(own ? w.v : w.h + " · " + w.v) : ""}`, true); } };
      requestAnimationFrame(() => { if (!makeWriter(c, o2, false, false)) next(); });
      $("#wHint").onclick = () => { stage.querySelector(".ask").textContent = `Nghe rồi viết chữ · ${py1}`; makeWriter(c, o2, true, true); $("#wHint").remove(); };
      $("#wSay").onclick = () => speak(c); setTimeout(() => speak(c), 250);
      return;
    }
    stage.innerHTML = `<div class="ask">${mem ? "Tự viết lại chữ này theo trí nhớ" : "Xem mẫu rồi tô theo nét mờ"}</div><div class="winfo"><div class="p">${esc(py1)}</div><div class="v">${w ? (own ? esc(w.v) : `trong từ ${mem ? esc(w.p) : `<span class="han">${esc(w.h)}</span>`} · ${esc(w.v)}`) : ""}</div></div>` + writeBoxHtml() +
      `<div class="wtools">${mem ? '<button class="btn ghost" id="wHint">Quên rồi · Xem mẫu</button>' : '<button class="btn ghost" id="wDemo">Xem lại mẫu</button>'}<button class="btn ghost" id="wSay">Nghe</button></div>` + (mem ? "" : strokeStrip(c));
    const opts = { onComplete: ({ totalMistakes }) => { S.mode = "check"; feedback(true, `<span class="h">${esc(c)}</span> · ${totalMistakes ? `sai ${totalMistakes} nét, lần sau cố hơn nhé` : mem ? "nhớ đúng hết các nét, giỏi quá!" : "đúng hết các nét!"}`, true); } };
    requestAnimationFrame(() => { if (!makeWriter(c, opts, !!ex.demo, !mem)) next(); });
    if (mem) $("#wHint").onclick = () => { makeWriter(c, opts, true, true); stage.insertAdjacentHTML("beforeend", strokeStrip(c)); $("#wHint").remove(); };
    else $("#wDemo").onclick = () => makeWriter(c, opts, true);
    $("#wSay").onclick = () => speak(c);
    speak(c);
  }
};

checkBtn.onclick = () => {
  if (S.mode === "intro") return next();
  if (S.mode !== "check" || checkBtn.disabled) return;
  const ok = S.checker();
  if (S.key !== undefined) markOptions(S.key);
  feedback(ok, S.sol);
};
skipBtn.onclick = () => next();
document.addEventListener("keydown", e => {
  if (!S || $("#lesson").hidden || e.key !== "Enter") return;
  if (!$("#sheet").hidden) { e.preventDefault(); $("#nextBtn").click(); }
  else if (!checkBtn.hidden && !checkBtn.disabled) { e.preventDefault(); checkBtn.click(); }
});

const PRAISE = ["Giỏi lắm!", "Tuyệt vời!", "Chính xác!", "Siêu quá!", "Đúng rồi!"];
const XP_CAU = 2, XP_THUONG = 5;   // mỗi câu đúng +2 · không sai câu nào thưởng +5
const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el, from, to, ms = 700) {
  if (!el) return; if (calm() || from === to) { el.textContent = to; return; }
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms), v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); el.textContent = v; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
  el.parentElement && (el.parentElement.classList.remove("bump"), void el.parentElement.offsetWidth, el.parentElement.classList.add("bump"));
}
function floatPlus(text, x, y) {
  if (calm()) return;
  const d = document.createElement("div"); d.className = "plus"; d.textContent = text; d.style.left = x + "px"; d.style.top = y + "px";
  document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
}
function sparks(x, y, n = 10) {
  if (calm()) return;
  const cols = ["#F2BE55", "#4E8F91", "#D2693F", "#8AA671", "#9C6B8E"];
  for (let i = 0; i < n; i++) {
    const a = Math.PI * 2 * i / n + Math.random() * .5, r = 50 + Math.random() * 50, sp = document.createElement("div");
    sp.className = "spark"; sp.style.left = (x - 7) + "px"; sp.style.top = (y - 7) + "px";
    sp.style.setProperty("--dx", Math.cos(a) * r + "px"); sp.style.setProperty("--dy", Math.sin(a) * r + "px");
    sp.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14"><path fill="${cols[i % cols.length]}" d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7Z"/></svg>`;
    document.body.appendChild(sp); setTimeout(() => sp.remove(), 750);
  }
}
function confetti(n = 110) {
  if (calm()) return;
  const cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
  const dpr = devicePixelRatio || 1, W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr, x = cv.getContext("2d");
  const cols = ["#F2BE55", "#4E8F91", "#D2693F", "#8AA671", "#6C8CB5", "#9C6B8E"];
  const ps = Array.from({ length: n }, (_, i) => ({ x: W / 2 + (Math.random() - .5) * W * .25, y: H * .3, vx: (Math.random() - .5) * 16 * dpr, vy: (-Math.random() * 15 - 5) * dpr,
    w: (6 + Math.random() * 6) * dpr, h: (4 + Math.random() * 4) * dpr, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[i % cols.length] }));
  const t0 = performance.now();
  const step = t => {
    x.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .45 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
    if (t - t0 < 2600) requestAnimationFrame(step); else cv.remove();
  };
  requestAnimationFrame(step);
}
function feedback(ok, sol, soft) {
  const ex = S.q[S.i];
  S.mode = "shown"; S.key = undefined;
  if (ok) {
    S.right++;
    if (!soft || S.q[S.i].t === "write" || S.q[S.i].t === "match") {
      const old = S.xp; S.xp += XP_CAU; countUp($("#lxp"), old, S.xp, 400);
      requestAnimationFrame(() => { const b = $("#sheetTtl").getBoundingClientRect(); sparks(b.left + 24, b.top + 20); floatPlus("+" + XP_CAU, b.left + 60, b.top - 6); });
    }
  }
  else if (!soft) { S.wrong++; if (!S.test) { S.hearts--; $("#hearts").textContent = S.hearts; if (!ex.retry) S.q.push({ ...ex, retry: true }); } }
  $("#foot").hidden = true;
  sfx(ok ? "ok" : soft ? "tap" : "bad");
  const sh = $("#sheet"); sh.className = "sheet " + (ok ? "ok" : "bad"); sh.hidden = false;
  $("#sheetTtl").innerHTML = (ok ? IC.okC : IC.badC) + (ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : soft ? "Cố lên nhé!" : "Chưa đúng rồi");
  $("#sheetSol").innerHTML = (ok || soft ? "" : "Đáp án đúng:<br>") + (sol || "");
  $("#nextBtn").className = "btn wide " + (ok ? "okb" : "badb");
  if (S.after) { S.after(); S.after = null; }
  $("#nextBtn").focus({ preventScroll: true });
}
$("#nextBtn").onclick = () => { if (S.hearts <= 0) return finish(false); next(); };
function next() { if (!S) return; S.i++; S.after = null; if (S.i >= S.q.length) finish(true); else renderEx(); }

function today(d = new Date()) { return d.toISOString().slice(0, 10); }
function finish(win) {
  $("#barFill").style.width = "100%";
  const total = S.right + S.wrong, acc = total ? Math.round(S.right / total * 100) : 100;
  let body;
  if (win) {
    const xp = S.xp + (S.wrong === 0 ? XP_THUONG : 0);
    const first = !P.done[S.node.id];
    S.xpTruoc = P.xp;
    P.done[S.node.id] = true; P.xp += xp;
    report(S.node, acc, xp);
    const t = today(), y = today(new Date(Date.now() - 864e5));
    if (P.last !== t) { P.streak = P.last === y ? P.streak + 1 : 1; P.last = t; }
    save();
    const where = S.node.intro ? "Học cách viết chữ" : `Bài ${S.node.lesson + 1}`;
    if (S.test) { P.badge = P.badge || {}; if (acc >= (P.badge[S.node.id] || 0)) P.badge[S.node.id] = acc; save(); }
    const dat = S.test && acc >= 80;
    body = `${mascot(S.test && !dat ? "wow" : "happy", "m")}<h1>${S.test ? (dat ? "Đạt rồi!" : "Gần đạt rồi!") : S.wrong === 0 ? "Hoàn hảo!" : "Xong bài rồi!"}</h1><p>${where} · ${esc(S.node.label)}${S.test ? ` · ${dat ? "huy hiệu vàng" : "cần 80% để lấy huy hiệu"}` : first ? "" : " (ôn lại)"}</p>
      <div class="tiles3"><div><b>+<span id="fXp">0</span></b><span>Điểm XP${S.wrong === 0 ? " · có thưởng" : ""}</span></div><div><b><span id="fAcc">0</span>%</b><span>Chính xác</span></div><div><b>${P.streak}</b><span>Ngày liên tiếp</span></div></div>
      <button class="btn" id="fDone">Tiếp tục</button>`;
  } else {
    body = `${mascot("sad", "m")}<h1>Hết tim rồi!</h1><p>Không sao cả, mình làm lại nhé.</p><button class="btn" id="fRetry">Làm lại</button><button class="btn ghost" id="fDone">Về trang chính</button>`;
  }
  $("#finishBody").innerHTML = body; $("#finish").hidden = false; $("#lesson").hidden = true;
  if (win) { confetti(); sfx("win"); setTimeout(() => { countUp($("#fXp"), 0, P.xp - S.xpTruoc, 900); countUp($("#fAcc"), 0, acc, 900); }, 350); }
  const xpTruoc = S.xpTruoc, xpSau = P.xp;
  const node = S.node;
  const xongCoBan = win && !P.all && !node.adv && !node.intro && node.lesson != null && basicDone(node.lesson);
  const moi = xongCoBan ? (!U ? () => openPay(true, node.lesson) : !U.nc ? () => openAdv(node.lesson, true) : null) : null;
  $("#fDone").onclick = () => { $("#finish").hidden = true; quitLesson(); if (win) countUp($("#xp"), xpTruoc, xpSau, 900); if (moi) setTimeout(moi, 350); requestAnimationFrame(() => { const c = document.querySelector(".node.cur"); c && c.scrollIntoView({ block: "center" }); }); };
  const r = $("#fRetry"); if (r) r.onclick = () => { $("#finish").hidden = true; startNode(node); };
}

renderAcct();
renderHome();
// đã đăng nhập: hỏi lại máy chủ (mở thêm nâng cao, tiến độ học ở máy khác)
if (U && API) callApi({ app: "dangnhap", u: U.u, m: U.m, giaoTrinh: "YCT1" }).then(r => {
  if (r && r.ok) { U.nc = !!r.nangCao; U.ten = r.ten || U.ten; saveU(); (r.tienDo || []).forEach(id => P.done[id] = true); save(); renderAcct(); renderHome(); }
  else if (r && r.loi && /chưa đúng|khoá/.test(r.loi)) { U = null; saveU(); renderAcct(); renderHome(); toast(r.loi); }
}).catch(() => {});
</script>
