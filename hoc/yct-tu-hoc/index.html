/* ---------- 02/10 chị: THANG BẬC kiểu Duolingo — XP · hạng · giải đấu tuần · cấp mỗi bài (5 cấp) · chặng lớn có bài kiểm tra ---------- */
const HANG=[[0,"Mầm","🌱"],[100,"Lá","🍃"],[300,"Hoa","🌸"],[600,"Cây","🌳"],[1000,"Rồng","🐉"]];
const GIAI=[["Đồng","🥉"],["Bạc","🥈"],["Vàng","🥇"],["Kim cương","💎"]],GIAI_LEN=150,GIAI_XUONG=40;   // XP/tuần để lên giải · dưới mức này thì xuống
const CAP_LO=["","đã học xong","luyện đề đạt từ 60%","luyện đề đúng hết","đã luyện khó","luyện khó không sai câu nào"];
const tuanNay=(d=new Date())=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+"-T"+Math.ceil(((t-y)/864e5+1)/7)};
const XP=()=>store.get("yct1-xp",{tong:0,tuan:{}});
const hangCua=x=>{let h=HANG[0];for(const r of HANG)if(x>=r[0])h=r;return h};
function giai(){const g=store.get("yct1-giai",{bac:0,tuan:tuanNay()}),t=tuanNay();if(g.tuan!==t){const x=XP().tuan[g.tuan]||0;g.bac=Math.max(0,Math.min(3,g.bac+(x>=GIAI_LEN?1:x<GIAI_XUONG&&g.bac>0?-1:0)));g.tuan=t;store.set("yct1-giai",g)}return g}
function themXP(x,ly){if(!x)return;const X=XP(),cu=hangCua(X.tong),t=tuanNay();X.tong+=x;X.tuan[t]=(X.tuan[t]||0)+x;store.set("yct1-xp",X);veXP();
  const d=document.createElement("div");d.className="xpBay";d.textContent=`+${x} XP`;document.body.appendChild(d);setTimeout(()=>d.remove(),1600);
  const moi=hangCua(X.tong);if(moi!==cu)setTimeout(()=>mung(moi[2],null,`Lên hạng ${moi[1]}!`,`Con đã có ${X.tong} XP — 真棒！`),1800)}
function veXP(){const b=document.getElementById("xpChip");if(!b)return;const X=XP(),h=hangCua(X.tong),g=giai();b.hidden=false;b.innerHTML=`${im(h[2])}<b>${X.tong}</b><span>XP</span>`;b.onclick=thangBac}
function thangBac(){const X=XP(),h=hangCua(X.tong),g=giai(),xt=X.tuan[tuanNay()]||0,o=document.createElement("div");o.className="pw";
  o.innerHTML=`<div class="pwb tb" role="dialog" aria-modal="true"><button class="x" aria-label="Đóng">✕</button><h3>Thang bậc của con</h3>
   <div class="tbK"><b class="tbG">${im(GIAI[g.bac][1])} Giải ${GIAI[g.bac][0]}</b><span>Tuần này: ${xt} XP</span><div class="lsBar"><i style="width:${Math.min(100,xt/GIAI_LEN*100)}%"></i></div><small>${g.bac<3?`Đủ ${GIAI_LEN} XP trong tuần → lên giải ${GIAI[g.bac+1][0]}`:"Giải cao nhất rồi! Giữ vững nhé"}${g.bac?` · dưới ${GIAI_XUONG} XP sẽ xuống giải`:""}</small></div>
   <h4>Hạng của con · ${X.tong} XP</h4><ol class="tbH">${HANG.map((r,i)=>`<li class="${r===h?"on":X.tong>=r[0]?"qua":""}">${im(r[2])}<b>${r[1]}</b><span>${r[0]} XP</span></li>`).join("")}</ol>
   <h4>Cách được XP</h4><ul class="pyt"><li>Xong 1 lượt làm bài <i>+10 · không sai câu nào +15</i></li><li>Luyện đề <i>+2 mỗi câu đúng</i></li><li>Đóng vai hội thoại <i>+5</i> · Luyện khó <i>+20</i> · Qua kiểm tra chặng <i>+30</i></li></ul>
   <h4>Cấp mỗi bài 👑</h4><ul class="pyt">${CAP_LO.slice(1).map((t,i)=>`<li>Cấp ${i+1} <i>— ${t}</i></li>`).join("")}</ul></div>`;
  document.body.appendChild(o);o.querySelector(".x").onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()}}
function capBai(n){if(!ND[n]&&!BUILT.includes(n))return 0;const L=nhomBai_n(n),X=new Set(store.get("yct1-bai-"+n,[]));if(!L||!X.has(L-1))return 0;
  const t=thiDiem(n),K=store.get("yct1-kho-"+n,{lan:0,hh:0});let c=1;if(n==0||ND[n]&&!ND[n].thi){if(K.lan)c=3;if(K.lan>=2)c=4;if(K.hh)c=5;return c}   // bài không có luyện đề: lên cấp bằng luyện khó
  if(t&&t[0]>=t[1]*.6)c=2;if(t&&t[0]===t[1])c=3;if(c>=3&&K.lan)c=4;if(c>=4&&K.hh)c=5;return c}
const nhomBai_n=n=>{try{return ND[n]?nhomBai(n).length:store.get("yct1-sol-"+n,0)}catch(e){return 0}};
const capHTML=c=>`<span class="cap">${[1,2,3,4,5].map(i=>`<i class="${i<=c?"on":""}">👑</i>`).join("")}</span>`;
function lenCap(n,cu){const m=capBai(n);if(ND[n])store.set("yct1-sol-"+n,nhomBai(n).length);if(m>cu){mung("🏆",null,`Bài ${n==0?"Mở đầu":n} lên cấp ${m}! 👑`,CAP_LO[m]);veBai(n)}}
const CHANG=[["Chặng 1","Chào hỏi & làm quen",[0,1,2,3,4]],["Chặng 2","Bản thân & đồ vật",[5,6,7,8]],["Chặng 3","Thời gian & ăn uống",[9,10,11,12]]];
const quaChang=k=>!!store.get("yct1-chang-"+k,false);
async function kiemTraChang(k){const B=CHANG[k][2].filter(n=>BUILT.includes(n)&&n>0);for(const n of B)if(!ND[n])await moBai(n).catch(()=>{});
  const Q=B.flatMap(n=>(ND[n]&&ND[n].thi||[]).map((q,i)=>({...q,_n:n,_i:i}))).map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,12);
  if(!Q.length)return alert("Chặng này chưa có bài");
  thiYCT(B[0],Q,(d,t)=>{const ok=d>=t*.7;if(ok&&!quaChang(k)){store.set("yct1-chang-"+k,true);themXP(30,"Qua chặng");mung("🏁",null,`Qua ${CHANG[k][0]}! (${d}/${t})`,k+1<CHANG.length?`Đã mở ${CHANG[k+1][0]}: ${CHANG[k+1][1]}`:"Con đã sẵn sàng thi YCT1!")}else if(!ok)mung("💪",null,`Được ${d}/${t} — cần 70% để qua chặng`,"Ôn lại các bài rồi làm lại nhé — 加油！");home()})}
/* bé chơi: nghe → chạm đúng hình */
function quiz(n){
  const c=ND[n],box=document.getElementById("quiz"),R=5;let r=0,ok=0,ans=null,tried=false;
  const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
  const round=()=>{
    if(r>=R){const s=ok>=5?3:ok>=3?2:1;ghiKQ(`c${n}-q`,`${n==0?"Mở đầu":"Bài "+n} · bé chơi`,ok*20);box.innerHTML=`<div class="stars">${[1,2,3].map(i=>`<span class="${i<=s?"":"off"}">★</span>`).join("")}</div><b style="font-size:20px">${ok}/${R} — ${s===3?"Bé giỏi quá! 真棒！":"Chơi lại nhé!"}</b><button class="big" id="qa">Chơi lại</button>`;keng();confetti();setTimeout(()=>play("aud/khen.mp3"),400);if(ok>=3&&xongCD(n)){setTimeout(()=>mung("🏆",null,`Xong ${n==0?"bài Mở đầu":"bài "+n}!`,"Quà cho bé: 10 phút nói với cô giáo thật — bấm “Đặt lịch nói với cô” nhé!"),1600);noiVe(n)}box.querySelector("#qa").onclick=()=>{r=0;ok=0;round()};return}
    const idx=sh([...c.w.keys()]).slice(0,4);ans=idx[Math.floor(Math.random()*4)];tried=false;
    box.innerHTML=`<p class="note" style="font-style:normal">Câu ${r+1}/${R} · bấm loa để nghe, rồi chạm hình đúng</p><button class="qhear" id="qh" aria-label="Nghe">🔊</button><div class="qopts">${idx.map(i=>{const e=c.w[i][3];return isNum(e)?`<button class="qo num" data-i="${i}">${im("🍎").repeat(+e)}<small>${e}</small></button>`:`<button class="qo" data-i="${i}">${im(e)}<small>${esc(c.w[i][2])}</small></button>`}).join("")}</div>`;
    const hear=()=>play(`aud/c${n}-w${ans}.mp3`);box.querySelector("#qh").onclick=hear;setTimeout(hear,300);
    box.querySelectorAll(".qo").forEach(b=>b.onclick=()=>{if(+b.dataset.i===ans){b.classList.add("right");if(!tried)ok++;tone([880,1320]);r++;setTimeout(round,900)}else{b.classList.add("wrong");tried=true;tone([180],.18,"square",.05);setTimeout(()=>b.classList.remove("wrong"),400)}});
  };

}
