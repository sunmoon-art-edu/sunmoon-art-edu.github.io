<title>Ngân hàng câu hỏi SunMoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=LXGW+WenKai+TC&family=Noto+Sans+SC:wght@400&display=swap">
<style>
:root{--bg:#FAF7F0;--surface:#FFFFFF;--ink:#2B2622;--ink-2:#6E655C;--line:#E8E0D0;--acc:#4E8F91;--acc-soft:#E1EEEE;--ok:#3F7D3A;--fb:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;--fh:"LXGW WenKai TC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E1B18;--surface:#2A2622;--ink:#F3EEE6;--ink-2:#B9AFA2;--line:#3D372F;--acc:#6FAEB0;--acc-soft:#24393A;--ok:#7DBA77}}
:root[data-theme="dark"]{--bg:#1E1B18;--surface:#2A2622;--ink:#F3EEE6;--ink-2:#B9AFA2;--line:#3D372F;--acc:#6FAEB0;--acc-soft:#24393A;--ok:#7DBA77}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--fb)}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:22px 70px}
h1{font:600 28px/1.15 var(--fb);margin:0 0 6px}
.lead{color:var(--ink-2);margin:0 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 14px/1 var(--fb);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font:600 14px/1 var(--fb);cursor:pointer}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bai{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:14px 0;padding:16px 16px 6px;break-inside:avoid}
.bai>h2{font:600 21px/1.3 var(--fb);margin:0 0 2px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.bai>h2 .zh{font-family:var(--fh);font-size:24px}
.bai>h2 .no{color:#fff;background:var(--acc);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.bai>.vi{color:var(--ink-2);margin-bottom:10px}
h3{font:600 13px/1 var(--fb);color:var(--ink-2);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.07em;border-top:2px solid var(--line);padding-top:12px}
h3 b{color:var(--acc)}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
td{padding:10px 12px;vertical-align:middle;background:var(--bg)}
td.q{border-radius:12px 0 0 12px;width:56%}
td.a{border-radius:0 12px 12px 0;color:var(--ink);font-weight:600;border-left:3px solid var(--acc)}
.h{font-family:var(--fh)}
td.q .h{font-size:22px;line-height:1.5}
td.a .h{font-size:24px;line-height:1.4}
.p{color:var(--ink-2);font-weight:500}
.mini{color:var(--ink-2);font-size:13px;font-weight:400}
.dl{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.dl .ln{max-width:88%;background:var(--bg);border-radius:14px;padding:8px 12px}
.dl .ln.b{align-self:flex-end;background:var(--acc-soft)}
.dl .ln .h{font-size:21px}
.doan{background:var(--bg);border-radius:14px;padding:12px}
.doan .h{font-size:21px;line-height:1.7}
.dap{display:none}
body.hien .dap{display:table-cell}
@media print{.tabs,.tools,.hint{display:none}.bai{border:0;border-bottom:1px solid #ccc;border-radius:0;padding:8px 0}td{background:none}body{background:#fff;color:#000}}
</style>
<div class="wrap">
  <h1>Ngân hàng câu hỏi</h1>
  <p class="lead">Toàn bộ câu hỏi app sẽ hỏi và đáp án đúng, theo từng bài. <span class="hint">App hỏi ngẫu nhiên trong kho này, mỗi lần học một ít.</span></p>
  <nav class="tabs" id="tabs"></nav>
  <div class="tools">
    <button class="btn on" id="tgl">Đang hiện đáp án</button>
    <button class="btn" id="inra">In / Lưu PDF</button>
  </div>
  <main id="ds"></main>
</div>
<script>
const DATA = /*DATA*/[];
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let cur = 0; try { cur = Math.min(+localStorage.getItem("nh-app") || 0, DATA.length - 1); } catch (e) {}
document.body.classList.add("hien");

const rows = list => `<table>${list.map(r => `<tr><td class="q">${r[0]}</td><td class="a dap">${r[1]}</td></tr>`).join("")}</table>`;
function veTabs() {
  document.getElementById("tabs").innerHTML = DATA.map((d, i) => `<button aria-pressed="${i === cur}" data-t="${i}">${esc(d.name)}</button>`).join("");
}
function veDs() {
  const d = DATA[cur];
  document.getElementById("ds").innerHTML = d.lessons.map(L => {
    const kho = [];
    kho.push(["Chọn nghĩa của từ", L.w.map(w => [`<span class="h">${esc(w[0])}</span> <span class="mini">${esc(w[1])}</span>`, esc(w[2])])]);
    kho.push(["Chọn pinyin", L.w.map(w => [`<span class="h">${esc(w[0])}</span>`, esc(w[1])])]);
    kho.push(["Nghe rồi chọn chữ · Nhìn nghĩa chọn chữ", L.w.map(w => [`nghe “${esc(w[1])}” / nghĩa “${esc(w[2])}”`, `<span class="h">${esc(w[0])}</span>`])]);
    if (L.ghep.length) kho.push(["Ghép chữ thành từ", L.ghep.map(w => [`${esc(w[2])} <span class="mini">${esc(w[1])}</span>`, `<span class="h">${esc(w[0])}</span>`])]);
    kho.push(["Xếp câu · Dịch sang tiếng Trung", L.s.map(s => [esc(s[2]), `<span class="h">${esc(s[0])}</span> <span class="mini">${esc(s[1])}</span>`])]);
    if (L.fill.length) kho.push(["Điền từ còn thiếu", L.fill.map(x => [`<span class="h">${esc(x[0])}</span> <span class="mini">${esc(x[2])}</span>`, `<span class="h">${esc(x[1])}</span>`])]);
    kho.push(["Đọc câu chọn nghĩa · Nghe chọn câu", L.s.map(s => [`<span class="h">${esc(s[0])}</span>`, esc(s[2])])]);
    if (L.viet.length) kho.push(["Nghe rồi viết chữ", L.viet.map(w => [`nghe “${esc(w[1])}” <span class="mini">${esc(w[2])}</span>`, `<span class="h">${esc(w[0])}</span>`])]);
    if (L.bothu.length) kho.push(["Bộ thủ (nâng cao)", L.bothu.map(b => [`<span class="h">${esc(b[0])}</span> thuộc bộ nào? ${b[4] ? `· ghép <span class="h">${esc(b[4])}</span>` : ""}`, `<span class="h">${esc(b[1])}</span> bộ ${esc(b[2])} · ${esc(b[3])}`])]);
    if (L.gp && L.gp.length) kho.push(["Ngữ pháp", L.gp.map(g => [
      `<span class="mini">${g.k === "dien" ? "Chọn từ đúng" : g.k === "xep" ? "Sắp xếp" : "Chọn câu đúng"}</span><br><span class="h">${esc(g.q)}</span>${g.v ? `<br><span class="mini">${esc(g.v)}</span>` : ""}<br><span class="mini">${g.o.map(o => esc(o)).join(" · ")}</span>`,
      `<span class="h">${esc(g.o[g.a])}</span><div class="mini" style="color:var(--ink-2);font-weight:400">${esc(g.g || "")}</div>`])]);
    if (L.dl) {
      kho.push(["Nghe hội thoại rồi trả lời", L.dl.qs.map(q => [`<span class="h">${esc(q.q)}</span> <span class="mini">${esc(q.v)}</span><br><span class="mini">${q.o.map(o => esc(o)).join(" · ")}</span>`, `<span class="h">${esc(q.o[q.a])}</span>`])]);
    }
    if (L.rd) {
      kho.push(["Đọc đoạn văn rồi trả lời", L.rd.qs.map(q => [`<span class="h">${esc(q.q)}</span> <span class="mini">${esc(q.v)}</span><br><span class="mini">${q.o.map(o => esc(o)).join(" · ")}</span>`, `<span class="h">${esc(q.o[q.a])}</span>`])]);
    }
    const dem = kho.reduce((n, k) => n + k[1].length, 0);
    return `<section class="bai"><h2><span class="no">Bài ${L.i}</span><span class="zh">${esc(L.zh)}</span></h2><div class="vi">${esc(L.vi)} · ${dem} câu hỏi</div>
      ${L.dl ? `<h3>Hội thoại · bài nghe</h3><div class="dl">${L.dl.lines.map(l => `<div class="ln${l.r === "B" ? " b" : ""}"><span class="h">${esc(l.z)}</span><div class="p">${esc(l.p)}</div><div class="mini">${esc(l.v)}</div></div>`).join("")}</div>` : ""}
      ${L.rd ? `<h3>Đoạn văn · bài đọc</h3><div class="doan"><span class="h">${esc(L.rd.z)}</span><div class="p">${esc(L.rd.p)}</div><div class="mini">${esc(L.rd.v)}</div></div>` : ""}
      ${kho.map(k => `<h3>${esc(k[0])} · <b>${k[1].length} câu</b></h3>${rows(k[1])}`).join("")}</section>`;
  }).join("");
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-t]"); if (!b) return;
  cur = +b.dataset.t; try { localStorage.setItem("nh-app", cur); } catch (x) {}
  veTabs(); veDs(); window.scrollTo(0, 0);
});
document.getElementById("tgl").onclick = () => {
  const on = document.body.classList.toggle("hien");
  document.getElementById("tgl").textContent = on ? "Đang hiện đáp án" : "Đang ẩn đáp án";
  document.getElementById("tgl").classList.toggle("on", on);
};
document.getElementById("inra").onclick = () => window.print();
veTabs(); veDs();
</script>
